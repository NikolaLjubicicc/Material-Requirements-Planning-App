<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <div class="logo">
      <mat-icon>precision_manufacturing</mat-icon>
      <span>Smart MRP</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/items" routerLinkActive="active">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Artikli</span>
      </a>
      <a mat-list-item routerLink="/bom" routerLinkActive="active">
        <mat-icon matListItemIcon>account_tree</mat-icon>
        <span matListItemTitle>Sastavnice (BOM)</span>
      </a>
      <a mat-list-item routerLink="/inventory" routerLinkActive="active">
        <mat-icon matListItemIcon>warehouse</mat-icon>
        <span matListItemTitle>Zalihe</span>
      </a>
      <a mat-list-item routerLink="/production-plans" routerLinkActive="active">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Planovi proizvodnje</span>
      </a>
      <a mat-list-item routerLink="/mrp" routerLinkActive="active">
        <mat-icon matListItemIcon>calculate</mat-icon>
        <span matListItemTitle>MRP</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>{{getPageTitle()}}</span>
    </mat-toolbar>

    <main class="main-content">
      <ng-content></ng-content>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
