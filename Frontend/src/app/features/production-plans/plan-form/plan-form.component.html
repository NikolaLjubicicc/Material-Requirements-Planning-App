<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Novi plan proizvodnje</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field class="full-width">
          <mat-label>Artikal (proizvod)</mat-label>
          <mat-select formControlName="itemId" required>
            <mat-option *ngFor="let item of items" [value]="item.id">
              {{item.sku}} - {{item.name}}
              <span class="category-hint">({{getCategoryLabel(item.category)}})</span>
            </mat-option>
          </mat-select>
          <mat-error>Odaberite artikal</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Potrebna količina</mat-label>
          <input matInput type="number" formControlName="requiredQuantity" min="1" required>
          <mat-error>Količina mora biti najmanje 1</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Rok (datum)</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dueDate" required>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          <mat-error>Datum je obavezan</mat-error>
        </mat-form-field>

        <div class="actions">
          <button mat-button type="button" routerLink="/production-plans">Odustani</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
            Kreiraj plan
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
