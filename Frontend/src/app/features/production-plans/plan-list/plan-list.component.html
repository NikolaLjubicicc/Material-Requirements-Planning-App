<div class="container">
  <div class="header">
    <h1>Planovi proizvodnje</h1>
    <button mat-raised-button color="primary" routerLink="/production-plans/new">
      <mat-icon>add</mat-icon>
      Novi plan
    </button>
  </div>

  <mat-tab-group (selectedTabChange)="onTabChange($event.index)">
    <mat-tab label="Svi"></mat-tab>
    <mat-tab label="Na čekanju"></mat-tab>
    <mat-tab label="U obradi"></mat-tab>
    <mat-tab label="Završeni"></mat-tab>
  </mat-tab-group>

  <table mat-table [dataSource]="filteredPlans" class="full-width mat-elevation-z2 mt-2">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let plan">{{plan.id}}</td>
    </ng-container>

    <ng-container matColumnDef="item">
      <th mat-header-cell *matHeaderCellDef>Artikal</th>
      <td mat-cell *matCellDef="let plan">{{plan.itemSku}} - {{plan.itemName}}</td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Količina</th>
      <td mat-cell *matCellDef="let plan">{{plan.requiredQuantity}}</td>
    </ng-container>

    <ng-container matColumnDef="dueDate">
      <th mat-header-cell *matHeaderCellDef>Rok</th>
      <td mat-cell *matCellDef="let plan">{{plan.dueDate}}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let plan">
        <span [class]="'status-badge status-' + plan.status.toLowerCase()">
          {{getStatusLabel(plan.status)}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Akcije</th>
      <td mat-cell *matCellDef="let plan">
        <button mat-icon-button [routerLink]="['/production-plans', plan.id]" matTooltip="Detalji">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="primary" [routerLink]="['/mrp/run', plan.id]"
                *ngIf="plan.status === 'PENDING'" matTooltip="Pokreni MRP">
          <mat-icon>play_arrow</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="cancelPlan(plan)"
                *ngIf="plan.status === 'PENDING'" matTooltip="Otkaži">
          <mat-icon>cancel</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
