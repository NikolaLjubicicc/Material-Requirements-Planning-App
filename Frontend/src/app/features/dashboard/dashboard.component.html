<div class="dashboard-container">
  <h1>Dashboard</h1>
  <p>Dobrodošli u Smart MRP sistem za planiranje materijalnih potreba.</p>

  <div class="stats-grid">
    <mat-card class="stat-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>inventory_2</mat-icon>
        <mat-card-title>Artikli</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="stat-number">{{itemsCount}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button routerLink="/items">Pregledaj</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>account_tree</mat-icon>
        <mat-card-title>Sastavnice</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="stat-number">{{bomCount}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button routerLink="/bom">Pregledaj</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>warehouse</mat-icon>
        <mat-card-title>Zalihe</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="stat-number">{{inventoryCount}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button routerLink="/inventory">Pregledaj</button>
      </mat-card-actions>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>assignment</mat-icon>
        <mat-card-title>Planovi proizvodnje</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="stat-number">{{plansCount}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button routerLink="/production-plans">Pregledaj</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div class="quick-actions mt-3">
    <h2>Brze akcije</h2>
    <button mat-raised-button color="primary" routerLink="/production-plans/new">
      <mat-icon>add</mat-icon>
      Novi plan proizvodnje
    </button>
    <button mat-raised-button color="accent" routerLink="/mrp" class="ml-1">
      <mat-icon>play_arrow</mat-icon>
      Pokreni MRP
    </button>
  </div>
</div>
