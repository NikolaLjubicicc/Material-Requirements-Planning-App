<div class="container">
  <div class="header">
    <h1>Zalihe</h1>
    <button mat-raised-button color="primary" routerLink="/inventory/new">
      <mat-icon>add</mat-icon>
      Nova zaliha
    </button>
  </div>

  <table mat-table [dataSource]="inventoryList" class="full-width mat-elevation-z2">
    <ng-container matColumnDef="item">
      <th mat-header-cell *matHeaderCellDef>Artikal</th>
      <td mat-cell *matCellDef="let inv">{{inv.itemSku}} - {{inv.itemName}}</td>
    </ng-container>

    <ng-container matColumnDef="quantityOnHand">
      <th mat-header-cell *matHeaderCellDef>Na stanju</th>
      <td mat-cell *matCellDef="let inv">{{inv.quantityOnHand | number:'1.0-3'}}</td>
    </ng-container>

    <ng-container matColumnDef="reservedQuantity">
      <th mat-header-cell *matHeaderCellDef>Rezervisano</th>
      <td mat-cell *matCellDef="let inv">{{inv.reservedQuantity | number:'1.0-3'}}</td>
    </ng-container>

    <ng-container matColumnDef="availableQuantity">
      <th mat-header-cell *matHeaderCellDef>Dostupno</th>
      <td mat-cell *matCellDef="let inv" [class.low-stock]="isLowStock(inv)">
        {{inv.availableQuantity | number:'1.0-3'}}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Akcije</th>
      <td mat-cell *matCellDef="let inv">
        <button mat-icon-button [routerLink]="['/inventory/adjust', inv.itemId]" matTooltip="Prilagodi">
          <mat-icon>tune</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
