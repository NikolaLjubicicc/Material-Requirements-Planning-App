<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Nova sastavnica</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field class="full-width">
          <mat-label>Roditelj (proizvod)</mat-label>
          <mat-select formControlName="parentItemId" required>
            <mat-option *ngFor="let item of items" [value]="item.id">
              {{item.sku}} - {{item.name}}
            </mat-option>
          </mat-select>
          <mat-error>Odaberite roditeljski artikal</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Komponenta</mat-label>
          <mat-select formControlName="componentItemId" required>
            <mat-option *ngFor="let item of items" [value]="item.id">
              {{item.sku}} - {{item.name}}
            </mat-option>
          </mat-select>
          <mat-error>Odaberite komponentu</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Količina</mat-label>
          <input matInput type="number" formControlName="quantity" min="0.01" step="0.01" required>
          <mat-error>Količina mora biti veća od 0</mat-error>
        </mat-form-field>

        <div class="actions">
          <button mat-button type="button" routerLink="/bom">Odustani</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
            Kreiraj
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
